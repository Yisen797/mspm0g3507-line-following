; WLK1501SPI-8P 屏幕测试 (ST7789 240x240)

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
monitor_port = COM14
upload_port = COM14
board_build.flash_mode = qio
board_build.f_flash = 80000000L

build_flags =
    -O2
    -D USER_SETUP_LOADED=1
    -D ST7789_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=240
    -D TFT_ROTATION=0
    -D TFT_CS=5
    -D TFT_DC=4
    -D TFT_RST=22
    -D TFT_BL=25
    -D TFT_BACKLIGHT_ON=HIGH
    -D SPI_FREQUENCY=40000000
    -D SMOOTH_FONT=1
    -D TOUCH_CS=-1

lib_deps =
    bodmer/TFT_eSPI @ ^2.5.0
