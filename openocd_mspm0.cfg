# MSPM0G3507 — use JTAG transport to bypass HLA DAP issues
source [find interface/stlink.cfg]

# Use hla_jtag instead of hla_swd
transport select hla_jtag
adapter speed 1000

# In JTAG mode, DAPs are detected via scan_chain
# Create a minimal target without explicit DAP
target create mspm0 cortex_m -endian little -chain-position 0

init
targets
halt
echo "=== Reading memory ==="
mdw 0x00000000 8
exit
